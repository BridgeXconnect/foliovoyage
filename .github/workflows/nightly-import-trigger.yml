name: Nightly Import Trigger

# Wakes the Render free-tier `atlas-api` web service and starts the nightly
# import (BRI-173). Render's free tier sleeps after 15 minutes with no
# inbound traffic, so ImportScheduler's in-process cron (default schedule
# IMPORT_CRON_SCHEDULE = "0 3 * * *" UTC, set on the Render service) cannot
# fire on its own while the process is asleep. This workflow calls the
# authenticated wake/trigger endpoint on the same schedule instead — the HTTP
# request itself both wakes the sleeping instance and starts the run.
#
# Keep the `on.schedule` cron below in sync with IMPORT_CRON_SCHEDULE if that
# ever changes — they are two independent configs with no shared source of
# truth.
#
# No secrets are hard-coded here. IMPORT_TRIGGER_SECRET must be set as a repo
# secret (Settings → Secrets and variables → Actions), matching the
# same-named env var already set on the Render service.

on:
  schedule:
    - cron: "0 3 * * *"
  # Lets a human fire this on demand from the Actions tab, e.g. to verify the
  # endpoint/secret wiring without waiting for 03:00 UTC.
  workflow_dispatch: {}

# Least privilege: this job only makes one outbound HTTP call, no repo access
# needed beyond checking out nothing at all.
permissions:
  contents: read

jobs:
  trigger:
    name: trigger
    runs-on: ubuntu-latest
    steps:
      - name: Wake Render service and trigger nightly import
        env:
          IMPORT_TRIGGER_SECRET: ${{ secrets.IMPORT_TRIGGER_SECRET }}
          API_TRIGGER_URL: https://atlas-api-oagl.onrender.com/v1/import/trigger
        run: |
          set -uo pipefail

          # --max-time is generous: a sleeping free-tier instance needs a cold
          # start (new container boot) before it can even route the request.
          http_status=$(curl --silent --show-error --output /tmp/response.json \
            --write-out "%{http_code}" \
            --max-time 90 \
            --request POST \
            --header "x-import-trigger-secret: ${IMPORT_TRIGGER_SECRET}" \
            "${API_TRIGGER_URL}") || http_status="curl_failed"

          echo "Response body:"
          cat /tmp/response.json 2>/dev/null || echo "(no response body — request may not have completed)"
          echo

          case "$http_status" in
            202)
              echo "Nightly import triggered successfully (HTTP 202)."
              ;;
            409)
              # The API's own concurrency guard (ImportRunService.hasRunningRun)
              # tripped — a run was already in flight. Not a failure of this
              # workflow, nothing further to do.
              echo "::warning::An import run was already in progress (HTTP 409) — nothing to do."
              ;;
            *)
              echo "::error::Trigger request failed (result: ${http_status})."
              exit 1
              ;;
          esac
