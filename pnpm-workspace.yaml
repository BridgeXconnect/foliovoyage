packages:
  - "apps/*"
  - "packages/*"

allowBuilds:
  '@tailwindcss/oxide': true
  sharp: true
  unrs-resolver: true
  '@prisma/client': true
  '@prisma/engines': true
  prisma: true

# Native post-install builds we trust and require:
# - @tailwindcss/oxide: Tailwind v4 engine (CSS build)
# - sharp: Next.js image optimization
# - unrs-resolver: eslint import resolver native binding
# - prisma / @prisma/client / @prisma/engines: fetch the Prisma query engine and
#   generate the typed client (ST-5 / BRI-100). Without these, `prisma generate`
#   and `prisma migrate` have no engine binary and fail.
onlyBuiltDependencies:
  - "@tailwindcss/oxide"
  - sharp
  - unrs-resolver
  - "@prisma/client"
  - "@prisma/engines"
  - prisma
